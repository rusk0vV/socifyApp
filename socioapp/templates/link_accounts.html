<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socify - Connect Your Social World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Enhanced Background Effects */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            opacity: 0.08;
            z-index: -2;
            filter: blur(1px);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(240, 147, 251, 0.3) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: particleFloat 20s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0px);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) translateX(50px);
                opacity: 0;
            }
        }
        /* Modern Navigation */
        .navbar {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: none !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1) !important;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 2rem !important;
            font-weight: 800;
            color: #ffffff !important;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none !important;
            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
        }

        .btn-gradient {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            padding: 0.7rem 2rem !important;
            border-radius: 50px !important;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1) !important;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.2) 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15) !important;
        }

        /* Main Content Container */
        .main-container {
            position: relative;
            z-index: 10;
            padding: 3rem 0;
        }

        /* Enhanced Typography */
        .hub-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .hub-desc {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: 4rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        /* Premium Link Cards */
        .link-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.5rem 2rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 500px;
            min-height: 200px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Platform Icons and Titles */
        .platform-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            margin-right: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .platform-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            letter-spacing: -0.5px;
        }

        .platform-icon:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        /* Enhanced Form Controls */
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 0 0 3px rgba(255, 255, 255, 0.1),
                0 8px 25px rgba(0, 0, 0, 0.1);
            outline: none;
            color: #ffffff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        /* Premium Connect Buttons */
        .btn-connect {
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 10px;
            border: none;
            padding: 0.8rem 0;
            margin-top: 0.3rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-connect::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-connect:hover::before {
            left: 100%;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
        }

        .btn-connect:active {
            transform: translateY(0);
        }

        /* Platform-Specific Button Styles */
        .btn-youtube {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.3);
        }

        .btn-youtube:hover {
            background: linear-gradient(135deg, #ff3333 0%, #ff0000 100%);
            box-shadow: 0 12px 35px rgba(255, 0, 0, 0.4);
            color: #ffffff;
        }

        .btn-instagram {
            background: linear-gradient(135deg, #e4405f 0%, #833ab4 50%, #f77737 100%);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(228, 64, 95, 0.3);
        }

        .btn-instagram:hover {
            background: linear-gradient(135deg, #f56565 0%, #9f7aea 50%, #ed8936 100%);
            box-shadow: 0 12px 35px rgba(228, 64, 95, 0.4);
            color: #ffffff;
        }

        .btn-reddit {
            background: linear-gradient(135deg, #ff4500 0%, #ff6b35 100%);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 69, 0, 0.3);
        }

        .btn-reddit:hover {
            background: linear-gradient(135deg, #ff6b35 0%, #ff4500 100%);
            box-shadow: 0 12px 35px rgba(255, 69, 0, 0.4);
            color: #ffffff;
        }

        .btn-github {
            background: linear-gradient(135deg, #333333 0%, #24292e 100%);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(51, 51, 51, 0.3);
        }

        .btn-github:hover {
            background: linear-gradient(135deg, #555555 0%, #333333 100%);
            box-shadow: 0 12px 35px rgba(51, 51, 51, 0.4);
            color: #ffffff;
        }

        /* Enhanced Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1.5rem;
            justify-items: center;
            padding: 0 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Main Content Container */
        .main-container {
            position: relative;
            z-index: 10;
            padding: 2rem 0;
        }

        /* Enhanced Typography */
        .hub-title {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .hub-desc {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 2.5rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hub-title {
                font-size: 2.5rem;
                letter-spacing: -1px;
            }
            
            .hub-desc {
                font-size: 1.1rem;
                padding: 0 1rem;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                gap: 1.5rem;
                padding: 0 1rem;
            }
            
            .link-card {
                padding: 2rem;
                max-width: 100%;
            }
            
            .platform-title {
                font-size: 1.3rem;
            }
            
            .navbar-brand {
                font-size: 1.7rem !important;
            }
            
            .btn-gradient {
                padding: 0.6rem 1.5rem !important;
                font-size: 1rem !important;
            }
        }

        @media (max-width: 480px) {
            .hub-title {
                font-size: 2rem;
            }
            
            .link-card {
                padding: 1.5rem;
            }
            
            .platform-icon {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles" id="particles-container"></div>

    <!-- Modern Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-share-alt me-2"></i>Socify
            </a>
            <div class="d-flex">
                <a href="/dashboard" class="btn btn-gradient">
                    <i class="fas fa-chart-line me-2"></i>Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="container">
            <div class="hub-title">Connect Your Social World</div>
            <div class="hub-desc">
                Link all your social media accounts in one unified hub.<br>
                Build your comprehensive digital presence dashboard with seamless integrations.
            </div>
            
            <div class="cards-grid">
                <!-- YouTube Card -->
                <form method="POST" class="link-card">
                    <div class="platform-title">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" class="platform-icon" alt="YouTube">
                        YouTube
                    </div>
                    <input type="text" name="youtube_channel" class="form-control" 
                           placeholder="Enter your channel name or ID" value="{{ youtube_channel }}">
                    <button type="submit" class="btn-connect btn-youtube">
                        <i class="fab fa-youtube me-2"></i>Connect YouTube
                    </button>
                </form>

                <!-- Instagram Card -->
                <form method="POST" class="link-card">
                    <div class="platform-title">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" class="platform-icon" alt="Instagram">
                        Instagram
                    </div>
                    <input type="text" name="instagram_username" class="form-control" 
                           placeholder="Enter your Instagram username" value="{{ instagram_username }}">
                    <button type="submit" class="btn-connect btn-instagram">
                        <i class="fab fa-instagram me-2"></i>Connect Instagram
                    </button>
                </form>

                <!-- Reddit Card -->
                <form method="POST" class="link-card">
                    <div class="platform-title">
                        <img src="https://www.redditstatic.com/desktop2x/img/favicon/favicon-96x96.png" class="platform-icon" alt="Reddit" style="background: #fff; padding: 4px; border-radius: 16px;">
                        Reddit
                    </div>
                    <input type="text" name="reddit_username" class="form-control" 
                           placeholder="Enter your Reddit username" value="{{ reddit_username }}">
                    <button type="submit" class="btn-connect btn-reddit">
                        <i class="fab fa-reddit me-2"></i>Connect Reddit
                    </button>
                </form>

                <!-- GitHub Card -->
                <form method="POST" class="link-card">
                    <div class="platform-title">
                        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" class="platform-icon" alt="GitHub">
                        GitHub
                    </div>
                    <input type="text" name="github_username" class="form-control" 
                           placeholder="Enter your GitHub username" value="{{ github_username }}">
                    <input type="text" name="github_repo" class="form-control" 
                           placeholder="Enter repository name (optional)" value="{{ github_repo }}">
                    <button type="submit" class="btn-connect btn-github">
                        <i class="fab fa-github me-2"></i>Connect GitHub
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles-container');
            if (!container) return;

            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                container.appendChild(particle);
            }
        }

        // Initialize particles
        createParticles();

        // GSAP Animations
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof gsap !== 'undefined') {
                // Set initial states
                gsap.set('.link-card', { opacity: 0, y: 50, scale: 0.9 });
                gsap.set('.hub-title', { opacity: 0, y: -30 });
                gsap.set('.hub-desc', { opacity: 0, y: -20 });

                // Create animation timeline
                const tl = gsap.timeline();
                
                tl.to('.hub-title', {
                    opacity: 1,
                    y: 0,
                    duration: 1,
                    ease: 'power3.out'
                })
                .to('.hub-desc', {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: 'power3.out'
                }, '-=0.5')
                .to('.link-card', {
                    opacity: 1,
                    y: 0,
                    scale: 1,
                    duration: 0.8,
                    ease: 'power3.out',
                    stagger: 0.1
                }, '-=0.3');

                // Add hover animations for forms
                document.querySelectorAll('.link-card').forEach(card => {
                    card.addEventListener('mouseenter', () => {
                        gsap.to(card, {
                            scale: 1.02,
                            duration: 0.3,
                            ease: 'power2.out'
                        });
                    });

                    card.addEventListener('mouseleave', () => {
                        gsap.to(card, {
                            scale: 1,
                            duration: 0.3,
                            ease: 'power2.out'
                        });
                    });
                });

                // Button click animations
                document.querySelectorAll('.btn-connect').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        gsap.to(this, {
                            scale: 0.95,
                            duration: 0.1,
                            ease: 'power2.out',
                            yoyo: true,
                            repeat: 1
                        });
                    });
                });
            }
        });

        // Enhanced form interactions
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                if (typeof gsap !== 'undefined') {
                    gsap.to(this, {
                        scale: 1.02,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                }
            });

            input.addEventListener('blur', function() {
                if (typeof gsap !== 'undefined') {
                    gsap.to(this, {
                        scale: 1,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                }
            });
        });

        // Platform icon hover effects
        document.querySelectorAll('.platform-icon').forEach(icon => {
            icon.addEventListener('mouseenter', function() {
                if (typeof gsap !== 'undefined') {
                    gsap.to(this, {
                        scale: 1.1,
                        rotation: 5,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                }
            });

            icon.addEventListener('mouseleave', function() {
                if (typeof gsap !== 'undefined') {
                    gsap.to(this, {
                        scale: 1,
                        rotation: 0,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                }
            });
        });
    </script>
</body>
</html>
