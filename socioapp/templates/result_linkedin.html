<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LinkedIn Profile Stats - Socify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
    <style>
        body { background: linear-gradient(135deg, #0077b5, #0f2027); color: #fff; }
        .glass-card { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 30px; box-shadow: 0 8px 32px rgba(31,38,135,0.25); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.18); }
        .stat-label { color: #0077b5; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-5" style="background: rgba(20,20,30,0.95); box-shadow: 0 2px 16px #00000040; border-bottom: 1.5px solid #fff70040;">
      <div class="container">
        <a class="navbar-brand neon-yellow" href="/">Socify</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#features">Features</a></li>
            <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          </ul>
          <a href="{{ url_for('logout') }}" class="btn btn-primary ms-3">Logout</a>
        </div>
      </div>
    </nav>
    <div class="container py-5">
        <div class="glass-card mx-auto" style="max-width: 500px;">
            <h2 class="mb-4"><i class="fab fa-linkedin"></i> LinkedIn Profile for <span class="stat-label">{{ username }}</span></h2>
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item bg-transparent text-white"><strong>Headline:</strong> {{ info['headline'] }}</li>
                <li class="list-group-item bg-transparent text-white"><strong>Location:</strong> {{ info['location'] }}</li>
                <li class="list-group-item bg-transparent text-white"><strong>Summary:</strong> {{ info['summary'] }}</li>
            </ul>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
