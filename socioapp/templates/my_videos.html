<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Videos - Socify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    body {
      background: linear-gradient(135deg, #0a1026 0%, #1a1f3a 100%);
      min-height: 100vh;
      color: #e2e6f3;
      font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .video-card {
      background: rgba(255, 0, 0, 0.1);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 0, 0, 0.2);
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .video-thumbnail {
      width: 120px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .video-info {
      flex: 1;
    }
    .video-title {
      color: #fff;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .video-stats {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: #6a7cff;
    }
    .back-btn {
      background: linear-gradient(90deg, #ff0000 0%, #6a7cff 100%);
      border: none;
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container py-5" style="margin-top: 80px;">
    <div class="d-flex justify-content-end mb-3">
      <a href="{{ url_for('youtube_stats_page') }}" class="btn back-btn">Back to Analytics</a>
    </div>
    <h2 class="mb-4" style="color: #ff0000; font-weight: 700;">My Last 5 Videos</h2>
    {% if videos %}
      {% for video in videos %}
      <div class="video-card">
        <img src="{{ video.thumbnail }}" alt="Video Thumbnail" class="video-thumbnail">
        <div class="video-info">
          <div class="video-title">{{ video.title }}</div>
          <div class="video-stats">
            <span><i class="fas fa-eye"></i> {{ video.views | format_followers }}</span>
            <span><i class="fas fa-thumbs-up"></i> {{ video.likes | format_followers }}</span>
            <span><i class="fas fa-comment"></i> {{ video.comments | format_followers }}</span>
            <span><i class="fas fa-calendar"></i> {{ video.published_date }}</span>
          </div>
        </div>
      </div>
      {% endfor %}
    {% else %}
      <div class="alert alert-warning">No videos found.</div>
    {% endif %}
  </div>
</body>
</html>
