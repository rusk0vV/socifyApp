<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socify - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
        }

        /* Advanced Background Effects */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(102, 126, 234, 0.9) 0%, 
                rgba(118, 75, 162, 0.8) 30%,
                rgba(240, 147, 251, 0.7) 70%,
                rgba(102, 126, 234, 0.9) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-illustration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            opacity: 0.15;
            filter: blur(1px);
        }

        /* Floating Geometric Shapes */
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: float 20s infinite ease-in-out;
        }

        .shape:nth-child(1) { width: 100px; height: 100px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 150px; height: 150px; top: 60%; left: 80%; animation-delay: 4s; }
        .shape:nth-child(3) { width: 80px; height: 80px; top: 80%; left: 20%; animation-delay: 8s; }
        .shape:nth-child(4) { width: 120px; height: 120px; top: 30%; left: 70%; animation-delay: 12s; }
        .shape:nth-child(5) { width: 90px; height: 90px; top: 10%; left: 80%; animation-delay: 16s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.6; }
        }

        /* Particle System */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: particleFloat 25s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .glass-card {
            background: rgba(255,255,255,0.4);
            border-radius: 18px;
            padding: 36px 32px 28px 32px;
            box-shadow: 0 8px 32px rgba(31,38,135,0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.18);
            transition: box-shadow 0.3s;
        }
        .glass-card:hover {
            box-shadow: 0 0 24px rgba(138,43,226,0.2);
        }
        .form-control {
            background-color: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
        }
        .form-control::placeholder {
            color: #e0e0e0;
        }
        .btn-login {
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            border: none;
            color: white;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(255,106,0,0.15);
        }
        .btn-login:hover {
            background: linear-gradient(90deg, #ee0979, #ff6a00);
        }
        .card-title {
            font-weight: bold;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1.2rem;
        }
        .form-check-label {
            color: #fff;
            font-size: 0.97rem;
        }
        .login-link {
            color: #2196f3 !important;
            font-weight: 500;
            text-shadow: none;
        }
    </style>
</head>
<body>
    <!-- Background Container -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="bg-illustration"></div>
        
        <!-- Floating Shapes -->
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        
        <!-- Particles -->
        <div class="particles" id="particles"></div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="glass-card" style="width: 370px;">
            <h3 class="card-title">Register</h3>
            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter your username">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="Enter your email">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Reddit Username</label>
                    <input type="text" name="reddit_username" class="form-control" placeholder="Enter your Reddit username (optional)">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <button class="btn btn-login w-100 mt-2">Register</button>
            </form>
            <div class="mt-3 text-center">
                <span class="text-white">Already have an account? </span>
                <a href="{{ url_for('login') }}" class="login-link">Login</a>
            </div>
        </div>
    </div>
    <script>
        // Create Particle System
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random positioning and timing
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 25 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 20) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize particles when page loads
        document.addEventListener('DOMContentLoaded', createParticles);
    </script>
</body>
</html>
