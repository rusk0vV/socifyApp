<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Stats - Socify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      background: #0a1026;
      min-height: 100vh;
      font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e6f3;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 800px; height: 800px;
      background: radial-gradient(circle, #333 0%, #6a7cff 60%, transparent 100%);
      opacity: 0.22;
      z-index: 0;
      animation: floatGlow 12s infinite alternate;
    }
    @keyframes floatGlow {
      0% { top: -200px; left: -200px; }
      100% { top: 0px; left: 0px; }
    }
    .glass-card {
      background: rgba(18, 22, 44, 0.92);
      border-radius: 24px;
      padding: 48px 32px 32px 32px;
      box-shadow: 0 8px 32px #333a, 0 0 0 2px #6a7cff;
      border: none;
      transition: box-shadow 0.3s, transform 0.2s;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(12px);
    }
    .glass-card:hover {
      box-shadow: 0 0 48px 12px #6a7cff80, 0 8px 32px #333a;
      transform: translateY(-6px) scale(1.03);
    }
    .section-divider {
      font-size: 2rem;
      color: #6a7cff;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #333 0%, #6a7cff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
    }
    .text-warning {
      color: #ff6a00 !important;
    }
    .text-info {
      color: #6a7cff !important;
    }
    a.text-info:hover {
      color: #333 !important;
    }
    .rounded-circle {
      box-shadow: 0 0 24px #6a7cff80;
    }
    ul.list-unstyled li {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    @media (max-width: 600px) {
      .glass-card { padding: 18px 8px; }
      .section-divider { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark mb-5" style="background: rgba(20,20,30,0.95); box-shadow: 0 2px 16px #00000040; border-bottom: 1.5px solid #fff70040;">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand neon-yellow" href="/">Socify</a>
      <button id="hamburgerBtn" class="btn" style="background: none; border: none; outline: none;">
        <i class="fas fa-bars fa-2x" style="color:#ff6a00;"></i>
      </button>
    </div>
  </nav>
  <!-- Welcome Greeting -->
  <div class="container mb-4">
    <h2 class="neon-yellow" style="font-size:2.2rem;">Welcome back, <span style="color:#ff6a00;">ali</span>!</h2>
  </div>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="glass-card text-center">
          <div class="section-divider"><i class="fab fa-github"></i> GitHub</div>
          <img src="{{ github_profile_url if github_profile_url else 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png' }}" alt="GitHub Profile Photo" class="rounded-circle mb-2" style="width:100px; height:100px; object-fit:cover; border: 3px solid #333;">
          <ul class="list-unstyled mt-4">
            <li>
              <strong class="text-warning">Username:</strong>
              <a href="https://github.com/{{ github_stats.username }}" target="_blank" class="text-info text-decoration-underline">
                {{ github_stats.username }}
              </a>
            </li>
            <li>
              <strong class="text-warning">Repository:</strong>
              <a href="{{ github_stats.repo_url }}" target="_blank" class="text-info text-decoration-underline">
                {{ github_stats.repo }}
              </a>
            </li>
            <li><strong class="text-warning">Stars:</strong> {{ github_stats.stars }}</li>
            <li><strong class="text-warning">Forks:</strong> {{ github_stats.forks }}</li>
            <li><strong class="text-warning">Watchers:</strong> {{ github_stats.watchers }}</li>
            <li><strong class="text-warning">Description:</strong> {{ github_stats.description }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      gsap.from('.glass-card', {
        duration: 1.2,
        opacity: 0,
        y: 60,
        scale: 0.85,
        ease: 'power3.out'
      });
    });
  </script>
</body>
</html>
